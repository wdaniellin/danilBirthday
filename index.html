<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Damoez's Birthday Aquarium</title>
  <!-- Supabase Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
  /* Lighter ocean gradient colors */
      --bg-top: #3a946e;
--bg-bottom: #095379;
      
      --modal-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #0284c7;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(to bottom, var(--bg-top), var(--bg-bottom));
      color: var(--text-main);
      position: relative;
    }

    #aquarium {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Simple Flat Bubbles */
    .bubble {
      position: absolute;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      bottom: -30px;
      animation: rise 9s infinite linear;
      pointer-events: none;
    }

    @keyframes rise {
      0% { transform: translateY(0); opacity: 0; }
      20% { opacity: 0.4; }
      100% { transform: translateY(-110vh); opacity: 0; }
    }

    /* Fish Wrapper */
    .fish-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      cursor: pointer;
      user-select: none;
      z-index: 5;
    }

    .fish-body {
      display: inline-block;
    }

    .fish-image {
      width: 180px;
      height: 120px;
      object-fit: contain;
      display: block;
    }

    /* Simple Flat Tooltip */
    .fish-tooltip {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      background: #090d16;
      color: var(--text-main);
      padding: 4px 10px;
      font-size: 12px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
    }

    .fish-wrapper:hover .fish-tooltip { 
      opacity: 1; 
    }

    /* UI Header Bar */
    .ui-layer {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .ui-layer * { pointer-events: auto; }

    h1 { 
      font-size: 1.25rem; 
      font-weight: 600;
    }

    /* Simple Flat Button */
    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
    }

    .btn:hover { 
      background: #0369a1;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: var(--modal-bg);
      padding: 24px;
      border-radius: 8px;
      width: 90%;
      max-width: 440px;
    }

    .modal h2 { 
      margin-bottom: 16px; 
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main); 
    }

    .form-group { margin-bottom: 14px; }
    
    .form-group label { 
      display: block; 
      margin-bottom: 6px; 
      font-size: 0.8rem; 
      font-weight: 500;
      color: var(--text-muted);
    }

    .form-group input[type="text"], .form-group textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: #0f172a;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }

    .form-group input[type="text"]:focus, .form-group textarea:focus {
      border-color: var(--accent);
    }

    .form-group textarea { height: 70px; resize: none; }

    /* Canvas Drawing Area */
    .canvas-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      overflow: hidden;
    }

    canvas {
      cursor: crosshair;
      touch-action: none;
      width: 100%;
      height: auto;
      display: block;
    }

    /* Flat Drawing Zone Indicator */
    .draw-zone-guide {
      position: absolute;
      top: 35%;       /* Matches y: 280 / 800 */
      left: 25%;      /* Matches x: 250 / 1000 */
      width: 53%;     /* Matches width: 530 / 1000 */
      height: 48%;    /* Matches height: 384 / 800 */
      border: 1px solid rgba(255, 255, 255, 0.7);
      background: transparent;
      pointer-events: none;
    }

    .canvas-tools {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
      width: 100%;
      justify-content: space-between;
    }

    .color-picker-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .color-btn {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid transparent;
      cursor: pointer;
    }

    .color-btn.active {
      border-color: #ffffff;
    }

    .btn-sm {
      padding: 4px 10px;
      font-size: 0.75rem;
      border-radius: 4px;
    }

    #paintCanvas {
      background-image: url("westernID.png");
      background-size: cover;
      background-position: center;
    }

    .scale-control {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .scale-control input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .btn-secondary { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); }
    .btn-secondary:hover { background: #0f172a; color: var(--text-main); }
  </style>
</head>
<body>

  <div class="ui-layer">
    <h1>Birthday Aquarium</h1>
    <button class="btn" id="openFormBtn">+ Leave a Birthday Wish</button>
  </div>

  <div id="aquarium"></div>

  <!-- Modal: View Message -->
  <div class="modal-overlay" id="viewModal">
    <div class="modal">
      <h2 id="viewName">From: Friend</h2>
      <p id="viewMessage" style="margin: 12px 0; line-height: 1.5; color: #cbd5e1; font-size: 0.95rem;"></p>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal('viewModal')">Close</button>
      </div>
    </div>
  </div>

  <!-- Modal: Add Wish -->
  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <h2>Add Your Fish</h2>
      <div class="form-group">
        <label>Your Name <span style="text-transform: none; color: #64748b;">(please do not name the fish)</span></label>
        <input type="text" id="inputName"/>
      </div>
      <div class="form-group">
        <label>Birthday Message</label>
        <textarea id="inputMessage"></textarea>
      </div>

      <!-- Drawing Pad -->
      <div class="form-group">
        <label>Draw Your Fish <span style="text-transform: none; color: #64748b;">(head faces RIGHT)</span></label>
        
        <div class="canvas-wrapper">
          <canvas id="paintCanvas" width="1000" height="800"></canvas>
          <div class="draw-zone-guide"></div>
        </div>

        <div class="canvas-tools">
          <div class="color-picker-group">
            <div class="color-btn active" style="background: #f97316" onclick="setBrushColor('#f97316', this)"></div>
            <div class="color-btn" style="background: #eab308" onclick="setBrushColor('#eab308', this)"></div>
            <div class="color-btn" style="background: #0db813" onclick="setBrushColor('#eab308', this)"></div>

            <div class="color-btn" style="background: #06b6d4" onclick="setBrushColor('#06b6d4', this)"></div>
            <div class="color-btn" style="background: #a855f7" onclick="setBrushColor('#a855f7', this)"></div>
            <div class="color-btn" style="background: #ec4899" onclick="setBrushColor('#ec4899', this)"></div>
            <div class="color-btn" style="background: #ffffff" onclick="setBrushColor('#ffffff', this)"></div>
            <div class="color-btn" style="background: #020202" onclick="setBrushColor('#020202', this)"></div>
          </div>
          <button class="btn btn-secondary btn-sm" onclick="clearCanvas()">Clear</button>
        </div>
      </div>

      <!-- Fish Size Scale Control -->
      <div class="form-group">
        <label>Fish Size: <span id="scaleValue" style="color: var(--text-main);">1.0x</span></label>
        <div class="scale-control">
          <input type="range" id="inputScale" min="0.5" max="1.5" step="0.1" value="1.0" oninput="document.getElementById('scaleValue').innerText = this.value + 'x'" />
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal('addModal')">Cancel</button>
        <button class="btn" id="submitFishBtn">Release Fish</button>
      </div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // SUPABASE SETUP (Replace with your actual Supabase credentials)
    // -------------------------------------------------------------
    const SUPABASE_URL = "https://nulfrogaxsenrivayven.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im51bGZyb2dheHNlbnJpdmF5dmVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMTMxNzYsImV4cCI6MjEwMTg4OTE3Nn0.5u5znq1K_pHx9OcLVFgYUfxYVZ3yogUcyDMsfWt58lI";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const aquarium = document.getElementById('aquarium');
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    
    let isDrawing = false;
    let currentColor = '#f97316';
    let fishes = [];

    const drawZone = {
      x: 250,      // 25% of 1000px
      y: 280,      // 35% of 800px
      width: 530,  // 53% of 1000px
      height: 384  // 48% of 800px
    };

    ctx.lineWidth = 10;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    function getCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    function isInsideDrawZone(pos) {
      return (
        pos.x >= drawZone.x &&
        pos.x <= drawZone.x + drawZone.width &&
        pos.y >= drawZone.y &&
        pos.y <= drawZone.y + drawZone.height
      );
    }

    function startDrawing(e) {
      const pos = getCanvasPos(e);
      if (!isInsideDrawZone(pos)) return;

      isDrawing = true;
      ctx.save();
      
      ctx.beginPath();
      ctx.rect(drawZone.x, drawZone.y, drawZone.width, drawZone.height);
      ctx.clip();

      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
      if (!isDrawing) return;
      const pos = getCanvasPos(e);
      ctx.strokeStyle = currentColor;
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDrawing() { 
      if (isDrawing) {
        ctx.restore();
        isDrawing = false; 
      }
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    canvas.addEventListener('touchstart', startDrawing);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', stopDrawing);

    function setBrushColor(color, el) {
      currentColor = color;
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function createSVGDataURL(color) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="160" height="100" viewBox="0 0 60 40">
        <path d="M 10 20 C 20 5, 45 5, 55 20 C 45 35, 20 35, 10 20 Z" fill="${color}" />
        <path d="M 10 20 L 0 5 L 0 35 Z" fill="${color}" />
        <circle cx="45" cy="15" r="3" fill="white" />
        <circle cx="46" cy="15" r="1.5" fill="black" />
      </svg>`;
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

    // Load initial fish data from Supabase DB
    async function fetchFishes() {
      const { data, error } = await supabaseClient.from('fishes').select('*');
      if (error) {
        console.error('Error fetching fishes:', error);
        return;
      }
      fishes = data.map(f => ({
        id: f.id,
        name: f.name,
        message: f.message,
        image: f.image,
        scale: f.scale,
        x: f.x,
        y: f.y,
        speed: f.speed,
        direction: f.direction,
        waveOffset: f.wave_offset
      }));
      renderFishes();
    }

    // Realtime subscription so friends' fish pop up live across devices
    function subscribeToRealtime() {
      supabaseClient
        .channel('public:fishes')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'fishes' }, payload => {
          const newF = payload.new;
          fishes.push({
            id: newF.id,
            name: newF.name,
            message: newF.message,
            image: newF.image,
            scale: newF.scale,
            x: newF.x,
            y: newF.y,
            speed: newF.speed,
            direction: newF.direction,
            waveOffset: newF.wave_offset
          });
          renderFishes();
        })
        .subscribe();
    }

    function renderFishes() {
      aquarium.querySelectorAll('.fish-wrapper').forEach(el => el.remove());
      
      fishes.forEach((fish) => {
        const fishEl = document.createElement('div');
        fishEl.className = 'fish-wrapper';
        fishEl.id = `fish-${fish.id}`;
        
        fishEl.innerHTML = `
          <div class="fish-body">
            <img src="${fish.image}" class="fish-image" alt="fish" />
          </div>
          <div class="fish-tooltip">From: ${fish.name}</div>
        `;

        fishEl.onclick = () => {
          document.getElementById('viewName').innerText = `From: ${fish.name}`;
          document.getElementById('viewMessage').innerText = `"${fish.message}"`;
          openModal('viewModal');
        };

        aquarium.appendChild(fishEl);
      });
    }

    let step = 0;
    function animate() {
      step += 0.03;
      const width = window.innerWidth;

      fishes.forEach(fish => {
        fish.x += fish.speed * fish.direction;
        
        if (fish.x > width - 180) {
          fish.direction = -1;
        } else if (fish.x < 10) {
          fish.direction = 1;
        }

        const floatY = fish.y + Math.sin(step + (fish.waveOffset || 0)) * 12;

        const wrapper = document.getElementById(`fish-${fish.id}`);
        if (wrapper) {
          wrapper.style.transform = `translate3d(${fish.x}px, ${floatY}px, 0)`;
          
          const body = wrapper.querySelector('.fish-body');
          if (body) {
            const baseScale = fish.scale || 1.0;
            const scaleX = fish.direction === 1 ? baseScale : -baseScale;
            body.style.transform = `scale(${scaleX}, ${baseScale})`;
          }
        }
      });
      requestAnimationFrame(animate);
    }

    function createBubbles() {
      for(let i = 0; i < 18; i++) {
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        const size = Math.random() * 8 + 4;
        bubble.style.width = `${size}px`;
        bubble.style.height = `${size}px`;
        bubble.style.left = `${Math.random() * 100}%`;
        bubble.style.animationDuration = `${Math.random() * 6 + 6}s`;
        bubble.style.animationDelay = `${Math.random() * 5}s`;
        document.body.appendChild(bubble);
      }
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    document.getElementById('openFormBtn').onclick = () => {
      clearCanvas();
      openModal('addModal');
    };

    function isCanvasBlank(c) {
      const blank = document.createElement('canvas');
      blank.width = c.width;
      blank.height = c.height;
      return c.toDataURL() === blank.toDataURL();
    }

    // Submit Wish & Save to Supabase
    document.getElementById('submitFishBtn').onclick = async () => {
      const name = document.getElementById('inputName').value.trim();
      const message = document.getElementById('inputMessage').value.trim();
      const scale = parseFloat(document.getElementById('inputScale').value) || 1.0;

      if(!name || !message) {
        alert('Please fill out both your name and message!');
        return;
      }

      let fishImageData;

      if (isCanvasBlank(canvas)) {
        fishImageData = createSVGDataURL(currentColor);
      } else {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = drawZone.width;
        tempCanvas.height = drawZone.height;
        const tempCtx = tempCanvas.getContext('2d');

        tempCtx.drawImage(
          canvas,
          drawZone.x, drawZone.y, drawZone.width, drawZone.height,
          0, 0, drawZone.width, drawZone.height
        );

        fishImageData = tempCanvas.toDataURL('image/png');
      }

      const newFishData = {
        name,
        message,
        image: fishImageData,
        scale,
        x: Math.random() * (window.innerWidth - 200) + 50,
        y: Math.random() * (window.innerHeight - 300) + 150,
        speed: Math.random() * 0.8 + 0.8,
        direction: Math.random() > 0.5 ? 1 : -1,
        wave_offset: Math.random() * 100
      };

      const { error } = await supabaseClient.from('fishes').insert([newFishData]);
      if (error) {
        alert('Error saving fish to Supabase. Please check your credentials.');
        console.error(error);
        return;
      }

      closeModal('addModal');

      document.getElementById('inputName').value = '';
      document.getElementById('inputMessage').value = '';
      document.getElementById('inputScale').value = '1.0';
      document.getElementById('scaleValue').innerText = '1.0x';
      clearCanvas();
    };

    createBubbles();
    fetchFishes();
    subscribeToRealtime();
    animate();
  </script>
</body>
</html>
